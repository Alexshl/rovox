# The core (`rovox serve`) and the rovox-skills sidecar. Set the token in the environment (or an untracked .env file):
#   ROVOX_TOKEN=<long random string> docker compose -f docker/compose.yml up
services:
  rovox:
    build:
      context: ..
      dockerfile: docker/Dockerfile
      target: runtime
    image: rovox
    command: ["serve", "--bind", "0.0.0.0"]
    environment:
      ROVOX_TOKEN: ${ROVOX_TOKEN:?set ROVOX_TOKEN}
    ports:
      - "127.0.0.1:4810:4810"
    volumes:
      - rovox-data:/data
  skills:
    build:
      context: ..
      dockerfile: docker/Dockerfile
      target: skills
    image: rovox-skills
    depends_on:
      - rovox
    environment:
      ROVOX_URL: http://rovox:4810/mcp
      ROVOX_TOKEN: ${ROVOX_TOKEN:?set ROVOX_TOKEN}
    stdin_open: true
    command: ["serve"]
volumes:
  rovox-data:
